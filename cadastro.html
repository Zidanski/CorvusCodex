<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — Corvus Codex</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Merriweather:wght@700&display=swap">
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/tema.js"></script>
</head>

<body>
    <header class="cabecalho">
        <nav aria-label="Principal">
            <a href="login.html">Login</a>
            <a href="cadastro.html">Cadastro</a>
            <a href="landing.html">Página Principal</a>
        </nav>
        <button type="button" class="botao-tema" aria-label="Alternar tema claro/escuro" aria-pressed="false">
            <span aria-hidden="true">☾</span>
        </button>
    </header>
    <h1>Cadastre-se</h1>

    <form>
        <fieldset>
            <legend>Informações de Login</legend>
            <label for="Email">Email</label>
            <input type="email" name="Email" id="Email">
            <br><br>
            <label for="Senha">Senha</label>
            <input type="password" id="Senha" name="Senha">
            <br>
            <label for="coSenha">Confirmar Senha</label>
            <input type="password" id="coSenha" name="coSenha">
            <br><br>
            <button type="submit">Cadastrar</button>

        </fieldset>
    </form>

</body>

</html>
