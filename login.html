<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Corvus Codex</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Merriweather:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/tema.js"></script>
</head>

<body>
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <header class="cabecalho">
        <nav aria-label="Principal">
            <a href="landing.html">Início</a>
            <a href="acervo.html">Acervo</a>
            <a href="pesquisa.html">Pesquisa</a>
            <a href="enviar.html">Enviar material</a>
            <a href="comentarios.html">Comentários</a>
            <a href="login.html" aria-current="page">Login</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
        <button type="button" class="botao-tema" aria-label="Alternar tema claro/escuro" aria-pressed="false">
            <span aria-hidden="true">☾</span>
        </button>
    </header>

    <main id="conteudo" tabindex="-1">
        <h1>Login</h1>

        <form method="post" data-validar data-demo>
            <fieldset>
                <legend>Informações de Login</legend>
                <p class="aviso-formulario" role="status"></p>
                <div class="campo">
                    <label for="Email">Email</label>
                    <input type="email" name="Email" id="Email" autocomplete="email" required>
                </div>
                <div class="campo">
                    <label for="Senha">Senha</label>
                    <input type="password" id="Senha" name="Senha" autocomplete="current-password" required>
                </div>
                <div class="botoes">
                    <button type="submit">Logar</button>
                </div>
            </fieldset>
        </form>
    </main>

    <footer class="rodape">
        <p>Corvus Codex · Biblioteca colaborativa de estudos · Centro Universitário Dom Helder</p>
    </footer>
    <script src="js/formularios.js"></script>
</body>

</html>
