<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa — Corvus Codex</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Merriweather:wght@400;700&display=swap">
    <link rel="stylesheet" href="css/estilo.css">
    <script src="js/tema.js"></script>
</head>

<body>
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <header class="cabecalho">
        <nav aria-label="Principal">
            <a href="landing.html">Início</a>
            <a href="acervo.html">Acervo</a>
            <a href="pesquisa.html" aria-current="page">Pesquisa</a>
            <a href="enviar.html">Enviar material</a>
            <a href="comentarios.html">Comentários</a>
            <a href="login.html">Login</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
        <button type="button" class="botao-tema" aria-label="Alternar tema claro/escuro" aria-pressed="false">
            <span aria-hidden="true">☾</span>
        </button>
    </header>

    <main id="conteudo" tabindex="-1" class="principal-largo">
        <h1>Pesquisa</h1>

        <form role="search" data-validar>
            <fieldset>
                <legend>Pesquisar</legend>
                <p class="aviso-formulario" role="status"></p>
                <div class="campo">
                    <label for="busca">Termo de pesquisa</label>
                    <input type="search" id="busca" name="q" placeholder="livros,material..." required aria-describedby="busca-dica">
                    <p class="dica" id="busca-dica">Procura no título, autor, disciplina, etiquetas e resumo. Ex.: sql, recursão, redes</p>
                </div>
                <div class="botoes">
                    <button type="submit">Pesquisar</button>
                    <button type="reset">Limpar</button>
                </div>
            </fieldset>
        </form>

        <section class="resultados" id="resultados" aria-labelledby="titulo-resultados" hidden>
            <h2 id="titulo-resultados">Resultados</h2>
            <p class="contagem" id="contagem" role="status"></p>
            <ul class="lista-cartoes" id="lista"></ul>
        </section>
    </main>

    <footer class="rodape">
        <p>Corvus Codex · Biblioteca colaborativa de estudos · Centro Universitário Dom Helder</p>
    </footer>
    <script src="js/formularios.js"></script>
    <script src="js/materiais.js"></script>
    <script src="js/pesquisa.js"></script>
</body>

</html>
