<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comentários - Corvus Codex</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <a href="index.html"><img class="logo" src="img/logo-horizontal-branco.svg" alt="Corvus Codex - página inicial"></a>
    <nav>
      <a href="index.html">Início</a>
      <a href="acervo.html">Acervo</a>
      <a href="pesquisa.html">Pesquisa</a>
      <a href="enviar.html">Enviar material</a>
      <a href="comentarios.html" aria-current="page">Comentários</a>
      <a href="info.html">Info</a>
    </nav>
    <div class="usuario">
      <span id="nome-usuario"></span>
      <button type="button" id="botao-sair" class="botao-sair">Sair</button>
    </div>
  </header>

  <main>
    <h1>Comentários</h1>
    <img class="ilustracao" src="img/comentarios.svg" alt="">
    <p id="sobre">Comentários gerais sobre o Corvus Codex. Para comentar um material, abra ele pelo Acervo.</p>

    <form id="formulario-comentario">
      <label for="comentario">Seu comentário</label>
      <textarea id="comentario" maxlength="1000" required></textarea>
      <button type="submit" id="botao-comentar">Comentar</button>
    </form>
    <p id="mensagem" class="mensagem" role="status"></p>

    <h2>Comentários recentes</h2>
    <ul id="lista-comentarios" class="lista-comentarios">
      <li>Carregando...</li>
    </ul>

    <h2>Mensagens para você</h2>
    <ul id="lista-mensagens" class="lista-comentarios">
      <li>Carregando...</li>
    </ul>
  </main>

  <script type="module" src="js/comentarios.js"></script>
</body>
</html>
