<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login e Cadastro - Corvus Codex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Início</a>
    <a href="acervo.html">Acervo</a>
    <a href="login.html">Login e Cadastro</a>
    <a href="pesquisa.html">Pesquisa</a>
    <a href="enviar.html">Enviar material</a>
    <a href="comentarios.html">Comentários</a>
  </nav>

  <main>
    <h1>Login e Cadastro</h1>
    <h2>Login</h2>
    <form>
      <label for="login-email">E-mail</label>
      <input type="email" id="login-email">
      <label for="login-senha">Senha</label>
      <input type="password" id="login-senha">
      <button type="submit">Entrar</button>
    </form>

    <h2>Cadastro</h2>
    <form>
      <label for="cad-nome">Nome</label>
      <input type="text" id="cad-nome">
      <label for="cad-email">E-mail</label>
      <input type="email" id="cad-email">
      <label for="cad-senha">Senha</label>
      <input type="password" id="cad-senha">
      <button type="submit">Cadastrar</button>
    </form>
  </main>
</body>
</html>
