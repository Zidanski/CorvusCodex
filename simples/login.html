<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Corvus Codex</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <img class="logo" src="img/logo-horizontal-branco.svg" alt="Corvus Codex">
  </header>

  <main class="centro">
    <img class="ilustracao" src="img/corvo.svg" alt="">
    <h1>Entrar no Corvus Codex</h1>
    <p>A biblioteca colaborativa de estudos. Para ver, enviar e comentar materiais, entre com a sua conta Google.</p>
    <button type="button" id="botao-google">Entrar com Google</button>
    <p id="mensagem" class="mensagem" role="status"></p>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
