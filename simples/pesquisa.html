<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisa - Corvus Codex</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <a href="index.html"><img class="logo" src="img/logo-horizontal-branco.svg" alt="Corvus Codex - página inicial"></a>
    <nav>
      <a href="index.html">Início</a>
      <a href="acervo.html">Acervo</a>
      <a href="pesquisa.html" aria-current="page">Pesquisa</a>
      <a href="enviar.html">Enviar material</a>
      <a href="comentarios.html">Comentários</a>
      <a href="info.html">Info</a>
    </nav>
    <div class="usuario">
      <span id="nome-usuario"></span>
      <button type="button" id="botao-sair" class="botao-sair">Sair</button>
    </div>
  </header>

  <main>
    <h1>Pesquisa</h1>
    <img class="ilustracao" src="img/pesquisa.svg" alt="">
    <form id="formulario-busca">
      <label for="busca">Buscar por título, autor, disciplina ou tag</label>
      <input type="search" id="busca" required>
      <button type="submit" id="botao-pesquisar" disabled>Pesquisar</button>
    </form>

    <p id="aviso" role="status">Carregando materiais...</p>
    <ul id="lista-resultados" class="lista-materiais"></ul>
  </main>

  <script type="module" src="js/pesquisa.js"></script>
</body>
